name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

# Least privilege: every job reads the repository only. The coverage-gate job raises its own
# permissions to post the sticky PR comment. Only the plain pull_request trigger is used, so a
# pull request from a fork runs with a read-only token and no secret.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1 — Unit tests (standalone C++ via GoogleTest) + coverage
  # GoogleTest is fetched automatically by CMake FetchContent.
  # Pinned to ubuntu-24.04 (not ubuntu-latest): the coverage numbers depend on the GCC version
  # (D-20). The 64-bit pure tests run first, then coverage.sh --ci rebuilds everything with -m32
  # (pure + ESP32 + ESP8266 characterization) and writes the line + branch reports.
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (C++)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake -B tests/unit/build -S tests/unit -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build tests/unit/build -j$(nproc)

    - name: Run tests
      run: cd tests/unit/build && ctest --output-on-failure --no-tests=error

    - name: Install coverage toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends g++-multilib
        python3 -m venv "$RUNNER_TEMP/covenv"
        "$RUNNER_TEMP/covenv/bin/pip" install --require-virtualenv --only-binary=:all: \
          -r tests/unit/requirements-coverage.lock.txt
        echo "$RUNNER_TEMP/covenv/bin" >> "$GITHUB_PATH"

    - name: Coverage (all test configurations)
      run: tests/unit/coverage.sh --ci

    - name: Coverage job summary
      if: always()
      run: |
        if [ -f tests/unit/out/report.md ]; then
          cat tests/unit/out/report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: tests/unit/out
        retention-days: 14

  # ──────────────────────────────────────────────
  # Job 2 — ESPHome compile (existing matrix)
  # Now depends on unit-tests passing first.
  # ──────────────────────────────────────────────
  esphome-build:
    name: ESPHome Build
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: [stable]
        variant: 
          - examples/root-configs/esp32-test
          - examples/root-configs/lossnay-test
          - examples/root-configs/hp-debug
          - examples/root-configs/hp-sejour
          - examples/m5stack-atoms3/atom-m5
          - examples/xiao-esp32s3/heatpump-xiaoESP32S3
          - examples/modular-hvac/hvac-sample
    container:
      image: ghcr.io/esphome/esphome:${{ matrix.version }}
    env:
      USERNAME: test
      PASSWORD: github-run
    steps:
    - uses: actions/checkout@v5
    - name: Generate random secret
      env:
        keys: >-
          mqtt_password ota_pwd
          wifi_ssid wifi_password
          wifi_ssid2 wifi_password2
          wifi_ssid3 wifi_password3
          wifi_ssid4 wifi_password4
          iot_ssid iot_password iot_domain fallback_password
          broker m5_login m5_password hvac_ota
        enc_keys: encryption_key_sejour encryption_key api_key hvac_api
      run: |
        for key in $keys ; do
          if [ "$key" = "iot_domain" ]; then
            value=".local"
          else
            value=`head -c 100 /dev/urandom | base64 | cut -c 1-24 | head -n1`
          fi
          echo "${key}: ${value}" >> secrets.yaml
        done
        for key in $enc_keys ; do
          value=`head -c 32 /dev/urandom | base64`
          echo "${key}: ${value}" >> secrets.yaml
        done
        # Copy secrets to example directories
        cp secrets.yaml examples/root-configs/
        cp secrets.yaml examples/m5stack-atoms3/
        cp secrets.yaml examples/m5stack-atoms3/includes/
        cp secrets.yaml examples/xiao-esp32s3/
        cp secrets.yaml examples/xiao-esp32s3/common/
        cp secrets.yaml examples/modular-hvac/
    - run: esphome compile ${{ matrix.variant }}.yaml
